<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Blitz Chess</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #eee;
    }
    header {
      background: #16213e;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #0f3460;
    }
    header .logo { font-size: 24px; }
    header h1 { font-size: 16px; font-weight: 700; color: #e94560; }
    main { padding: 16px; }
    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 600;
      font-size: 13px;
    }
    #status.active {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid #28a745;
      color: #5ecf7f;
    }
    #status.inactive {
      background: rgba(108, 117, 125, 0.2);
      border: 1px solid #6c757d;
      color: #adb5bd;
    }
    .info-box {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.6;
      font-size: 13px;
      color: #ccc;
    }
    .info-box .label {
      font-weight: 700;
      color: #e94560;
      display: block;
      margin-bottom: 6px;
    }
    .blocked { color: #e74c3c; }
    .allowed { color: #2ecc71; }
    footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
      border-top: 1px solid #0f3460;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">♟️</span>
    <h1>No Blitz Chess</h1>
  </header>
  <main>
    <div id="status" class="inactive">
      <span id="status-icon">⚪</span>
      <span id="status-text">Checking...</span>
    </div>
    <div class="info-box">
      <span class="label">Blocked time controls:</span>
      <span class="blocked">🚫 Bullet</span> &nbsp;
      <span class="blocked">🚫 Blitz</span>
      <br /><br />
      <span class="label">Allowed time controls:</span>
      <span class="allowed">✅ Rapid</span> &nbsp;
      <span class="allowed">✅ Daily</span>
    </div>
  </main>
  <footer>No Blitz Chess v1.0 — Play slower, play better.</footer>
  <script src="popup.js"></script>
</body>
</html>
